name: Test Charts

on:
  pull_request:
  push:
    branches: [master]

jobs:
  generic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - run: helm lint charts/generic
      - run: python3 -m unittest discover -s tests -v
